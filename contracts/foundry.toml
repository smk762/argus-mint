[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.38"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
cbor_metadata = false
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]
# Python-built fixtures (vouchers, Merkle proofs) are read by the forge tests.
fs_permissions = [{ access = "read", path = "../tests/fixtures" }]

[fuzz]
runs = 512

[fmt]
line_length = 120
