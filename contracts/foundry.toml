[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.38"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
cbor_metadata = false
ignored_warnings_from = ["lib"]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]
# Python-built fixtures (vouchers, Merkle proofs) are read by the forge tests.
fs_permissions = [{ access = "read", path = "../tests/fixtures" }, { access = "read", path = "./out" }]

[fuzz]
runs = 512

[fmt]
line_length = 120

# Target chain: Base (OP Stack). Mainnet 8453, testnet Base Sepolia 84532.
# URLs come from the environment (`make deploy` loads ../.env).
[rpc_endpoints]
base = "${BASE_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

# Basescan verification through the Etherscan V2 API (one key covers every chain).
[etherscan]
base = { key = "${ETHERSCAN_API_KEY}", chain = 8453 }
base_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 84532 }
