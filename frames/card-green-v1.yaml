# Green leather card frame (969x1352). The art window is landscape, about 4:3, so templates
# meant for this frame should render landscape (e.g. 1152x896, SDXL's nearest size): a square
# render loses about a quarter of its height to cropping, a 1152x896 one about 6%.
#
# Text slots: argus-mint fills `name` (the card's name) and `bio` (written from a bio
# template). `class` and `stats` take the consumer's display text (--text class=...): they
# show a record the consumer supplies, and must never be read back as game power (hard rule 4).
# Fonts: Cinzel and Crimson Text, both SIL Open Font License (fonts/OFL-*.txt).
id: card-green
version: 1
status: draft             # draft | approved | retired
overlay: card-green-v1.png
window: {x: 81, y: 159, width: 808, height: 593}
texts:
  name:  {x: 110, y: 80,   width: 760, height: 54,  font: fonts/Cinzel.ttf, size: 42, min_size: 22, colour: "#26301a"}
  class: {x: 110, y: 768,  width: 760, height: 50,  font: fonts/Cinzel.ttf, size: 30, min_size: 18, colour: "#26301a"}
  bio:   {x: 108, y: 872,  width: 750, height: 318, font: fonts/CrimsonText-Italic.ttf, size: 38, min_size: 22,
          colour: "#2b2a1e", align: left, valign: top, wrap: true, line_spacing: 1.1}
  stats: {x: 738, y: 1216, width: 136, height: 56,  font: fonts/CrimsonText-Bold.ttf, size: 34, min_size: 16, colour: "#26301a"}
