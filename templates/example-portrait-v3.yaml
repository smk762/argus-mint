# Example render template, v3. Copy it into the consumer's repo, adjust, and have a human
# review it: approval means setting status: approved plus approved_by / approved_at.
# Only approved templates render; every variable value must come from its list.
# Before approving, run every combination through darkroom's pre-flight:
#   argus-mint preflight templates/example-portrait-v3.yaml --darkroom http://localhost:8106
#
# v3 is v2 with fixes from its library (48 combinations on eight checkpoints):
# - Flux takes no negative prompt, so "no lettering" goes in the prompt itself (v2's Flux art
#   had handwriting across a "writing" background).
# - Centaur, giant and cyborg are described. Unexplained, models drew a horse, an ordinary
#   person and a person in armour, or (SDXL) bare-chested figures that failed the SFW check.
# - The character is clothed in a tunic bearing the heraldry ("heraldry" alone read as a crest,
#   not a garment), and the negative prompt rules out nudity. Colour "none" is now "plain".
# Each list keeps its length and order, so a library built with the same seed picks the same
# combinations as v2's and the two compare group for group.
id: example-portrait
version: 3
status: draft             # draft | approved | retired
model: sdxl/aureanuanceXL_v2/aureanuanceXL_v2.safetensors   # darkroom checkpoint (GET /models)
# Checkpoints a card may choose instead (reviewed with the template). The SDXL ones share the
# sampling below; Flux has its own (sampling_by_family) and no negative prompt (negative_by_family).
models:
  - sdxl/aureanuanceXL_v2/aureanuanceXL_v2.safetensors
  - sdxl/bigLove_xl2/bigLove_xl2.safetensors
  - sdxl/cyberrealisticXL_desireV20/cyberrealisticXL_desireV20.safetensors
  - sdxl/epicrealismXL_pureFix/epicrealismXL_pureFix.safetensors
  - sdxl/eventHorizon_xlV60/eventHorizon_xlV60.safetensors
  - sdxl/juggernautXL_ragnarokBy/juggernautXL_ragnarokBy.safetensors
  - sdxl/realityBoundxl_soulgripV10/realityBoundxl_soulgripV10.safetensors
  - flux/flux1-dev-fp8.safetensors
loras: []
sampling:                                 # fixed here so a render is reproducible
  sampler: euler
  scheduler: normal
  steps: 25
  cfg: 6.0
sampling_by_family:                       # Flux dev: distilled guidance, cfg 1
  flux: {sampler: euler, scheduler: simple, steps: 20, cfg: 1.0, guidance: 3.5}
negative_by_family:                       # darkroom's Flux workflows take no negative prompt
  flux: ""
width: 1152               # landscape, SDXL's nearest size to card-green's ~4:3 art window
height: 896
prompt: "waist-up portrait of a single {gender} {role}, centered and facing the viewer, fully clothed in a tunic bearing {colour} heraldry, {pose}, background: {background}, painted fantasy illustration, full bleed, detailed face, no lettering or writing anywhere in the image"
negative: "nude, nudity, bare chest, topless, cleavage, text, letters, words, handwriting, script, caption, title, label, logo, watermark, signature, border, frame, card frame, trading card, playing card, game ui, icons, badges, numbers, multiple people, crowd, empty scene, landscape, gore"
variables:
  role: [knight, ranger, sailor, elf, dark elf, wraith, centaur with a horse's body below the waist, cyborg with metal limbs and glowing implants, dwarf, human, orc, goblin, huge broad-shouldered giant dwarfing the room, dragon, wizard, priest]
  gender: [male, female, non-binary]
  colour: [crimson, azure, emerald, gold, silver, bronze, copper, iron, steel, obsidian, plain]
  pose: [standing, charging, on guard, kneeling, sitting, sleeping, dead, fighting, casting a spell, praying, drinking, eating, reading, writing, sewing, knitting, weaving, cooking, cleaning, gardening, fishing, hunting, gathering, building, repairing, chopping wood, mining]
  background: [cave, castle, dungeon, forest, garden, library, laboratory, academy, temple, workshop, none]
max_attempts: 4
