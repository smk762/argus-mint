# Embodied: painted into a scene's character_area. Once a LoRA trained on approved references
# passes argus-proof, `lora`, `proof_run` and `proof_export` are pinned into a new version (from GET /report/<run>/manifest).
id: keeper
version: 1
status: draft
project: example-teasers
voice: keeper
presence: embodied
# A figure standing in the room, not a portrait: the scene's character_area is a standing figure's
# box, and the lamp beside it is the light.
prompt: "three-quarter length figure of an elderly lighthouse keeper standing in a dim room at night, seen from a few steps away, weathered face, short grey beard, dark oilskin coat, knitted cap, lit warmly from one side by lamplight, painted illustration"
negative: "close-up, headshot, portrait, cropped head, flat front lighting, nude, nudity, text, letters, watermark, signature"
# How the LoRA is trained (docs/projects.md#training-an-identity), and the proof metric it is checked on.
check_metric: identity
training:
  model: sdxl/juggernautXL_ragnarokBy/juggernautXL_ragnarokBy.safetensors  # the scenes' checkpoint
  sampling: {sampler: dpmpp_2m, scheduler: karras, steps: 28, cfg: 6.0}
  width: 1024
  height: 1024
  candidates: 60
  train: 30
  held_out: 8
  trigger: kpr_keeper
