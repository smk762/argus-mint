<!doctype html>
<!-- The example harbour-camera overlay (example-teasers/harbour-feed v1): a fixed camera's feed
     over the lamp's view. Plain HTML and CSS, no kit and nothing from the network. Captured with
     scripts/capture_frame.py (capture.json); the art shows through everywhere but the marks. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>harbour-feed overlay</title>
<link rel="stylesheet" href="overlay.css">
</head>
<body>
<div class="corner tl"></div><div class="corner tr"></div>
<div class="corner bl"></div><div class="corner br"></div>

<div class="status">
  <div><span class="rec"></span>REC&ensp;CAM 03 · HARBOUR MOUTH</div>
  <div class="time">2026-11-18&ensp;03:14:07</div>
</div>

<div class="label-tab"></div>

<div class="signal">
  <div>SIG <span class="bars"><i></i><i></i><i></i><i class="off"></i></span></div>
  <div>IR&ensp;AUTO</div>
</div>

<div class="reticle">
  <div class="ring"></div>
  <div class="tick n"></div><div class="tick s"></div><div class="tick e"></div><div class="tick w"></div>
</div>

<div class="band"></div>
</body>
</html>
